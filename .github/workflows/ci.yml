name: CI

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: ShellCheck
        run: shellcheck skills/cmux/scripts/cmux-v5-lib.sh tests/cmux-v5-lib-test.sh

      - name: cmux v5 tests
        run: tests/cmux-v5-lib-test.sh
